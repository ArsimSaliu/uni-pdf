name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the offline download
# (uni-pdf.zip). The release notes come from that version's CHANGELOG.md section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the app version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "const VERSION = '$V';" app/app.js || { echo "app/app.js VERSION is not $V. Run: npm run version -- $V"; exit 1; }
          grep -q "uni-pdf-$V'" app/sw.js || { echo "app/sw.js CACHE is not $V"; exit 1; }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/build-site.js
      - name: Extract release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          printf '\n---\n**Use it online:** https://arsimsaliu.github.io/uni-pdf/app/\n\n**Offline version:** download `uni-pdf.zip` below, unzip it, and double-click `index.html`.\n' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/uni-pdf.zip --title "uni-pdf $GITHUB_REF_NAME" --notes-file notes.md
